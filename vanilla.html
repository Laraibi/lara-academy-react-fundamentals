<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le défi JavaScript · Lara Academy</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="mx-auto max-w-2xl px-5 py-12">
      <a href="/" class="text-indigo-200 underline">Retour à la boutique</a>
      <section class="mt-8 rounded-2xl border border-white/10 bg-panel p-8">
        <p class="text-sm font-semibold uppercase tracking-widest text-indigo-200">JavaScript · Manipuler le DOM</p>
        <h1 class="mt-3 text-3xl font-bold">Le casque de Hamza</h1>
        <p class="my-6 text-muted">Casque : 150 DH</p>
        <button id="add" class="cursor-pointer rounded-lg bg-accent px-4 py-3 font-semibold text-ink hover:bg-amber-300 focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-indigo-300">Ajouter un casque</button>
        <p class="mt-6 text-lg">Articles : <strong id="count">0</strong></p>
        <p class="mt-3 text-lg">Total : <strong id="total" class="text-accent">0 DH</strong></p>
      </section>
    </main>
    <script type="module" src="/vanilla.js"></script>
  </body>
</html>
